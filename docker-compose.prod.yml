# /paservices/docker-compose.prod.yml
services:
  #################
  # REVERSE PROXY #
  #################
  traefik:
    image: traefik:v3.0
    platform: linux/arm64 # Explicitly request the arm64 version
    container_name: paservices_traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true" # Exposes the Traefik dashboard on port 8080 (for debugging)
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}" # Your email for certs
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certificates:/letsencrypt"
    networks:
      - paservices-network

  ################
  # AUTH SERVICE #
  ################
  auth_service:
    image: ${DOCKER_USERNAME}/auth_service:latest # Will be pulled from your container registry
    platform: linux/arm64
    container_name: auth_service_prod
    env_file: ./auth_service/.env.prod
    restart: unless-stopped
    networks:
      - paservices-network
    # dns:
    #   - "1.1.1.1" # Cloudflare DNS
    #   - "8.8.8.8" # Google DNS
    depends_on:
      - traefik
    environment:
      - PYTHONPATH=/app/src
      - AUTH_SERVICE_M2M_JWT_SECRET_KEY=${SHARED_M2M_JWT_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-service.rule=Host(`${AUTH_SERVICE_DOMAIN}`)"
      - "traefik.http.routers.auth-service.entrypoints=websecure"
      - "traefik.http.routers.auth-service.tls.certresolver=letsencrypt"
      - "traefik.http.services.auth-service.loadbalancer.server.port=8000"

  ####################
  # SUPER ID SERVICE #
  ####################
  super_id_service:
    image: ${DOCKER_USERNAME}/super_id_service:latest
    platform: linux/arm64
    container_name: super_id_service_prod
    env_file: ./super_id_service/.env.prod
    restart: unless-stopped
    networks:
      - paservices-network
    depends_on:
      - auth_service
    environment:
      - PYTHONPATH=/app/src
      - SUPER_ID_SERVICE_M2M_JWT_SECRET_KEY=${SHARED_M2M_JWT_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.super-id-service.rule=Host(`${SUPER_ID_SERVICE_DOMAIN}`)"
      - "traefik.http.routers.super-id-service.entrypoints=websecure"
      - "traefik.http.routers.super-id-service.tls.certresolver=letsencrypt"
      - "traefik.http.services.super-id-service.loadbalancer.server.port=8000"

  ####################################
  # DATA CAPTURE RIGHTMOVE SERVICE #
  ####################################
  data_capture_rightmove_service:
    image: ${DOCKER_USERNAME}/data_capture_rightmove_service:latest
    platform: linux/arm64
    container_name: data_capture_rightmove_service_prod
    env_file: ./data_capture_rightmove_service/.env.prod
    restart: unless-stopped
    networks:
      - paservices-network
    depends_on:
      - auth_service
      - super_id_service
    environment:
      - PYTHONPATH=/app/src
      - DATA_CAPTURE_RIGHTMOVE_SERVICE_M2M_JWT_SECRET_KEY=${SHARED_M2M_JWT_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.data-capture-rightmove-service.rule=Host(`${DATA_CAPTURE_RIGHTMOVE_SERVICE_DOMAIN}`)"
      - "traefik.http.routers.data-capture-rightmove-service.entrypoints=websecure"
      - "traefik.http.routers.data-capture-rightmove-service.tls.certresolver=letsencrypt"
      - "traefik.http.services.data-capture-rightmove-service.loadbalancer.server.port=8000"

  ################
  # FLOORPLAN SERVICE #
  ################
  floorplan_service:
    image: ${DOCKER_USERNAME}/floorplan_service:latest
    platform: linux/arm64
    container_name: floorplan_service_prod
    env_file: ./floorplan_service/.env.prod
    restart: unless-stopped
    networks:
      - paservices-network
    depends_on:
      - auth_service
      - super_id_service
    environment:
      - PYTHONPATH=/app/src
      - FLOORPLAN_SERVICE_M2M_JWT_SECRET_KEY=${SHARED_M2M_JWT_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.floorplan-service.rule=Host(`${FLOORPLAN_SERVICE_DOMAIN}`)"
      - "traefik.http.routers.floorplan-service.entrypoints=websecure"
      - "traefik.http.routers.floorplan-service.tls.certresolver=letsencrypt"
      - "traefik.http.services.floorplan-service.loadbalancer.server.port=8000"

  ##########################
  # DATA CAPTURE SERVICE #
  ##########################
  data_capture_service:
    image: ${DOCKER_USERNAME}/data_capture_service:latest
    platform: linux/arm64
    container_name: data_capture_service_prod
    env_file: ./data_capture_service/.env.prod
    restart: unless-stopped
    networks:
      - paservices-network
    depends_on:
      - auth_service
      - super_id_service
    environment:
      - PYTHONPATH=/app/src
      - DATA_CAPTURE_SERVICE_M2M_JWT_SECRET_KEY=${SHARED_M2M_JWT_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.data-capture-service.rule=Host(`${DATA_CAPTURE_SERVICE_DOMAIN}`)"
      - "traefik.http.routers.data-capture-service.entrypoints=websecure"
      - "traefik.http.routers.data-capture-service.tls.certresolver=letsencrypt"
      - "traefik.http.services.data-capture-service.loadbalancer.server.port=8000"

  ################
  # MCP SERVICE #
  ################
  pa_mcp:
    image: ${DOCKER_USERNAME}/pa_mcp:latest
    platform: linux/arm64
    container_name: pa_mcp_prod
    env_file: ./pa_mcp/.env.prod
    restart: unless-stopped
    networks:
      - paservices-network
    depends_on:
      - auth_service
      - super_id_service
    environment:
      - PYTHONPATH=/app/src
      - PA_MCP_M2M_JWT_SECRET_KEY=${SHARED_M2M_JWT_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pa-mcp.rule=Host(`${PA_MCP_DOMAIN}`)"
      - "traefik.http.routers.pa-mcp.entrypoints=websecure"
      - "traefik.http.routers.pa-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.pa-mcp.loadbalancer.server.port=8000"

  ################
  # REDIS SERVICE #
  ################
  # This internal Redis service can be used by all other services
  redis:
    image: redis:7-alpine
    platform: linux/arm64 # Explicitly request the arm64 version
    container_name: paservices_redis
    restart: unless-stopped
    networks:
      - paservices-network

networks:
  paservices-network:
    name: paservices-network

volumes:
  traefik-certificates:
