  # Data Capture Service
  data_capture_service:
    extends:
      file: data_capture_service/docker-compose.dev.yml
      service: data_capture_service_dev
    ports:
      - "8006:8000"
    networks:
      - paservices_network
      - supabase_network_paservices
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MCP Service
  pa_mcp:
    extends:
      file: pa_mcp/docker-compose.dev.yml
      service: pa_mcp_dev
    ports:
      - "8005:8000"
    networks:
      - paservices_network
      - supabase_network_paservices
    logging:
