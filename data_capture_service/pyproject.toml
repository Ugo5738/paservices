[project]
name = "data-capture-service"
version = "0.1.0"
description = "Agnostic data capture service with pluggable adapters for property data extraction."
authors = [
    {name = "daniel", email = "danielnwachukwu5738@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
  # Core web framework
  "fastapi>=0.111.0,<1.0.0",
  "uvicorn[standard]>=0.30.1,<1.0.0",

  # Settings and data validation
  "pydantic[email]>=2.5.0,<3.0.0",
  "pydantic-settings>=2.3.4,<3.0.0",

  # Database (psycopg3 for consistency with other PA services)
  "sqlalchemy[asyncio]>=2.0.31,<3.0.0",
  "psycopg[binary,pool]>=3.1.8,<4.0.0",
  "alembic>=1.13.1,<2.0.0",

  # Security and Authentication
  "python-jose[cryptography]>=3.3.0,<4.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "PyJWT>=2.8.0,<3.0.0",

  # HTTP client
  "httpx>=0.27.0,<1.0.0",

  # External Services
  "slowapi>=0.1.9,<1.0.0",
  "boto3>=1.34.0,<2.0.0",

  # Data extraction providers
  "firecrawl-py>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = []

# --- Poetry Specific Configuration ---
[tool.poetry]
name = "data-capture-service"
version = "0.1.0"
description = "Agnostic data capture service with pluggable adapters for property data extraction."
authors = ["daniel <danielnwachukwu5738@gmail.com>"]
readme = "README.md"
packages = [{include = "data_capture_service", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
pydantic = {extras = ["email"], version = "^2.7.4"}
pydantic-settings = "^2.3.4"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.31"}
psycopg = {extras = ["binary", "pool"], version = "^3.1.19"}
alembic = "^1.13.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
PyJWT = "^2.8.0"
httpx = "^0.27.0"
slowapi = "^0.1.9"
boto3 = "^1.34.0"
firecrawl-py = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
asgi-lifespan = "^2.1.0"
ruff = "^0.4.10"
black = "^24.4.2"
mypy = "^1.10.0"
pre-commit = "^3.7.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
